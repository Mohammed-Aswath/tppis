name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check tppis tests
      - run: ruff format --check tppis tests
      - run: mypy --strict

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # CPython 3.8 has no official macOS arm64 builds.
          - os: macos-latest
            python-version: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing

  numpy-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy: ["1.26.4", "2.1.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "numpy==${{ matrix.numpy }}"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Test the installed wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl pytest
          /tmp/wheelenv/bin/pytest --pyargs tppis || /tmp/wheelenv/bin/python -c "import tppis; print(tppis.__version__)"
          cd /tmp
          /tmp/wheelenv/bin/python -c "from tppis import TPPIS, screen; print('ok', TPPIS)"
