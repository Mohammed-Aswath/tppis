[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tppis"
version = "0.1.0"
description = "Truncated Preconditioned Profiled Independence Screening for high-dimensional data with multicollinearity."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Mohammed Aswath M", email = "mohammed.aswath07@gmail.com" },
]
maintainers = [
    { name = "Mohammed Aswath M", email = "mohammed.aswath07@gmail.com" },
]
keywords = [
    "feature-selection",
    "variable-screening",
    "high-dimensional",
    "multicollinearity",
    "factor-analysis",
    "SIS",
    "TPPIS",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6",
]

[project.optional-dependencies]
datasets = [
    "pandas>=2.0",
]
repro = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "joblib>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.82",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pandas>=2.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/Mohammed-Aswath/tppis"
Documentation = "https://github.com/Mohammed-Aswath/tppis"
Source = "https://github.com/Mohammed-Aswath/tppis"
Issues = "https://github.com/Mohammed-Aswath/tppis/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/tppis",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["tppis"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["tppis", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tppis"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["tppis"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
